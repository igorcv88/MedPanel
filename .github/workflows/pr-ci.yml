name: Pull request checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Diagnose stale lockfile dependency
        run: npm view react-icons@5.7.0 dist.integrity
      - name: Install dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Production build
        run: npm run build
